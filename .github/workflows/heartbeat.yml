name: APEX heartbeat
on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes, 24/7
  workflow_dispatch: {}       # manual "Run workflow" button for testing
permissions: {}
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/heartbeat.mjs
